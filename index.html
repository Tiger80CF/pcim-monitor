function buildKPI() {

    const tile = mk("div", { cls: "kt" }, [

      mk("div", { style: { display: "flex", alignItems: "flex-end", justifyContent: "space-between" } }, [

          mk("span", { cls: "kd", txt: (up ? "\u25B2" : "\u25BC") + Math.abs(delta), style: { color: col } })

        (() => {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("width", "75"); svg.setAttribute("height", "26");
          const mn = Math.min(...v), mx = Math.max(...v), r = mx - mn || 1;
          const pts = v.map((x, i) => (i === 0 ? "M" : "L") + ((i / (v.length - 1)) * 75).toFixed(1) + "," + (26 - ((x - mn) / r) * 22 - 2).toFixed(1)).join(" ");

}

  if (alerts.length > 3) bTxt = "CRITICAL: Cluster of " + alerts.length + " alerts detected in Distressed/LME. Life insurer exposure to senior creditor displacement is elevating. Contagion risk rising.";
  else if (alerts.length > 0) bTxt = "Advisory: " + alerts.length + " active alert(s) in credit markets. Monitoring for cross-domain contagion and duration mismatch.";
  txt.appendChild(h); txt.appendChild(mk("div", { cls: "sy-b", txt: bTxt }));
  s.appendChild(synth); s.appendChild(txt);
}

function jump() { const a = C.filter(x => x.sg === "Alert"); if (a.length) highlight(a[0].id); }
function highlight(id) {
  hlId = id; render();
  if (hlTimer) clearTimeout(hlTimer);
  hlTimer = setTimeout(() => { hlId = null; render(); }, 3000);
  const el = document.getElementById("c_" + id); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

function reset() { fSig = []; fDom = "All"; fAgt = []; fHash = ""; fScen = null; $("srch").value = ""; render(); }

function render() {
  fHash = $("srch").value; buildSidebar();
  const vis = C.filter(c => { if (isBlockedUrl(c.url)) return false;
    if (fSig.length && !fSig.includes(c.sg)) return false;
    if (fDom !== "All" && c.dm !== fDom) return false;
    if (fAgt.length && !fAgt.includes(c.ag)) return false;
    if (fHash) {
      const h = fHash.toLowerCase().split(" ").filter(x => x);
      if (!h.every(term => c.tg.some(t => t.toLowerCase().includes(term.replace(/^#/, ""))) || c.ti.toLowerCase().includes(term))) return false;
    }
    return true;
  });
  buildSynthesis(vis);
  const alerts = C.filter(x => x.sg === "Alert");
  if (alerts.length) { $("bnr").style.display = "flex"; $("bt").textContent = "\u{1F534} " + alerts.length + " Active Alerts \u2014 click to view"; }
  else $("bnr").style.display = "none";
  $("tally").innerHTML = "";
  const tc = { Alert: 0, Confirmed: 0, Monitor: 0, Regulatory: 0 };
  vis.forEach(c => { if (c.sg in tc) tc[c.sg]++; });
  [["Alert", "#dc2626", "\u{1F534}"], ["Confirmed", "#16a34a", "\u{1F7E2}"], ["Monitor", "#ca8a04", "\u{1F7E1}"], ["Regulatory", "#2563eb", "\u{1F535}"]].forEach(([s, col, ic]) => {
    if (tc[s]) { $("tally").appendChild(mk("span", { style: { color: col, fontWeight: "700", marginRight: "12px" }, txt: ic + " " + tc[s] + " " + s })); }
  });
  const grid = $("grid"); grid.innerHTML = "";
  const grp = {}; vis.forEach(c => { (grp[c.dm] = grp[c.dm] || []).push(c); });
  [...DM].filter(d => grp[d]).forEach(d => {
    const col = mk("div", {});
    col.appendChild(mk("div", { cls: "ch", txt: (DL[d] || d) + " " + grp[d].length, style: { borderBottomColor: DA[d] } }));
    grp[d].forEach(c => {
      const s = SG[c.sg] || SG.Monitor;
      const card = mk("div", { cls: "cd" + (c.id === hlId ? " hl" : ""), id: "c_" + c.id, style: { borderLeftColor: s.b } });
      card.onclick = () => { if (c.url) window.open(c.url, '_blank'); };
      card.appendChild(mk("div", { cls: "ct" }, [mk("span", { cls: "bg", txt: s.i + " " + c.sg, style: { background: s.bg, color: s.c } }), mk("span", { txt: c.ag, style: { color: AC[c.ag], fontFamily: "monospace", fontSize: "10px" } })]));
      card.appendChild(mk("div", { cls: "ci", txt: c.ti }));
      card.appendChild(mk("div", { cls: "cs", txt: c.su }));
      const tags = mk("div", { cls: "cth" });
      c.tg.slice(0, 4).forEach(t => {
        const h = mk("button", { cls: "ht", txt: t }); h.onclick = (e) => { e.stopPropagation(); $("srch").value = t; render(); }; tags.appendChild(h);
      });
      card.appendChild(tags);
      var srcSpan = mk("span", { txt: c.sr }); if (c.xs) { var xb = mk("span", { cls: "x-src", txt: "X #privatecredit" }); srcSpan.appendChild(xb); } card.appendChild(mk("div", { cls: "cf" }, [srcSpan, mk("span", { txt: c.dt })]));
      if (c.url) {
        const link = mk("a", { cls: "cl", txt: "\u{1F517} Open Source \u2192", style: { } });
        link.href = c.url; link.target = "_blank"; link.onclick = (e) => e.stopPropagation();
        card.appendChild(link);
      }
      col.appendChild(card);
    });
    grid.appendChild(col);
  });
}

    alertHtml += '</div>';
  });

  content += '<div style="font-size: 12px; color: #71717a;">' + date + '</div></div></div>';
  content += '<div style="background: #111114; border: 1px solid #27272a; padding: 15px; border-radius: 8px; margin-bottom: 20px;">';
  content += '<h3 style="color: #fbbf24; margin-top: 0;">AI SYNTHESIS</h3>';
  content += '<p style="font-size: 14px;">' + synthTxt + '</p></div>';
  content += '<h3 style="color: #71717a; border-bottom: 1px solid #27272a; padding-bottom: 5px;">MARKET KPIS</h3>';
  content += '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">' + kpiHtml + '</div>';
  content += '<h3 style="color: #dc2626; border-bottom: 1px solid #27272a; padding-bottom: 5px;">CRITICAL ALERTS</h3>';
  content += alertHtml;
  content += '<div style="margin-top: 30px; text-align: center; font-size: 10px; color: #52525b;">Proprietary &amp; Confidential</div></div>';
  var opt = {
    margin: [10, 10],
    filename: 'PCIM_Report.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#09090b' },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }

  html2pdf().set(opt).from(content).save();
}

try { buildKPI(); buildReg(); render(); } catch(e) { document.getElementById("grid").innerHTML = '<div style="color:#dc2626;padding:20px;">JS Error: ' + e.message + '</div>'; } function openUpload() { var d = document.getElementById('upm'); if (!d) { var ov = document.createElement('div'); ov.id = 'upm'; ov.className = 'upm-overlay'; ov.innerHTML = '<div class="upbox"><h2>Submit Content for Evaluation</h2><div class="upsub">Paste a URL or describe research for credibility evaluation, rating, and inclusion.</div><div class="upfld"><label>Title</label><input id="up-ti" placeholder="e.g. Goldman Sachs: Private Credit Stress Report"></div><div class="upfld"><label>Source / Firm</label><input id="up-sr" placeholder="e.g. Goldman Sachs Research"></div><div class="upfld"><label>URL</label><input id="up-url" placeholder="https://..."></div><div class="upfld"><label>Summary / Key Findings</label><textarea id="up-su" placeholder="Describe the key findings or thesis..."></textarea></div><div style="display:flex;gap:8px"><div class="upfld" style="flex:1"><label>Domain</label><select id="up-dm"><option value="CreditMarkets">Credit Markets</option><option value="Macro">Macro &amp; Rates</option><option value="Regulatory">Regulatory</option><option value="Actuarial">Actuarial/ALM</option></select></div><div class="upfld" style="flex:1"><label>Signal</label><select id="up-sg"><option value="Monitor">Monitor</option><option value="Alert">Alert</option><option value="Confirmed">Confirmed</option><option value="Regulatory">Regulatory</option></select></div></div><div class="upfld"><label>Tags (comma separated)</label><input id="up-tg" placeholder="#privatecredit, #directlending"></div><div class="upfld"><label>Upload File (PDF/text)</label><div id="up-drop" onclick="document.getElementById(\'up-file\').click()">Drop file here or click to browse<br><span id="up-file-name" style="color:#60a5fa"></span><input type="file" id="up-file" accept=".pdf,.txt,.doc,.docx" onchange="if(this.files[0])document.getElementById(\'up-file-name\').textContent=this.files[0].name"></div></div><div id="eval-out" class="eval-box"></div><div class="up-acts"><button class="up-evalb" onclick="evalContent()">Evaluate &amp; Rate</button><button id="up-add-btn" class="up-addb" onclick="addCard()">Add to Monitor</button><button class="up-canb" onclick="closeUpload()">Cancel</button></div></div>'; document.body.appendChild(ov); } document.getElementById('upm').classList.add('show'); } function closeUpload() { var d = document.getElementById('upm'); if (d) d.classList.remove('show'); } function evalContent() { var ti = document.getElementById('up-ti').value.trim(); var sr = document.getElementById('up-sr').value.trim(); var url = document.getElementById('up-url').value.trim(); var su = document.getElementById('up-su').value.trim(); if (!ti || !su) { alert('Title and Summary are required.'); return; } var score = 0, factors = []; if (ti.length > 10) { score += 15; factors.push('Title quality'); } if (su.length > 30) { score += 20; factors.push('Summary depth'); } if (url && url.startsWith('http')) { score += 20; factors.push('Source URL'); } if (sr) { score += 15; factors.push('Source attribution'); } var ws = ['morgan stanley','goldman sachs','jpmorgan','ubs','blackrock','pimco','apollo','kkr','ares','blue owl','carlyle','brookfield','oaktree','hps','barclays','citi','bofa','wells fargo','deutsche bank'].some(function(f) { return sr.toLowerCase().includes(f) || ti.toLowerCase().includes(f); }); if (ws) { score += 15; factors.push('Wall Street firm'); } var kt = ['private credit','direct lending','bdc','clo','covenant','default','spread','leverage','distress','redemption','liquidity','pik','insurance','actuarial'].filter(function(t) { return (ti + ' ' + su).toLowerCase().includes(t); }); score += Math.min(kt.length * 3, 15); if (kt.length) factors.push(kt.length + ' key terms'); score = Math.min(score, 100); var r = score >= 80 ? 'A' : score >= 60 ? 'B+' : score >= 40 ? 'B' : 'C'; var cl = score >= 80 ? '#16a34a' : score >= 60 ? '#3b82f6' : score >= 40 ? '#ca8a04' : '#71717a'; var eo = document.getElementById('eval-out'); eo.className = 'eval-box show'; eo.innerHTML = '<div style="font-size:10px;font-weight:700;color:#71717a;margin-bottom:8px;letter-spacing:1px">EVALUATION RESULTS</div><div class="eval-row"><span class="eval-lbl">Credibility Score</span><span class="eval-val" style="font-size:18px;color:' + cl + '">' + score + '/100</span></div><div class="eval-row"><span class="eval-lbl">Rating</span><span class="eval-val" style="color:' + cl + '">' + r + '</span></div><div class="eval-row"><span class="eval-lbl">Domain</span><span class="eval-val">' + (DL[document.getElementById('up-dm').value] || document.getElementById('up-dm').value) + '</span></div><div class="eval-row"><span class="eval-lbl">Signal</span><span class="eval-val">' + document.getElementById('up-sg').value + '</span></div><div style="font-size:9px;color:#52525b;margin-top:4px">Factors: ' + factors.join(', ') + '</div>'; if (score >= 40) document.getElementById('up-add-btn').style.display = 'block'; } function addCard() { var url = document.getElementById('up-url').value.trim(); if (isBlockedUrl(url)) { alert('This source domain is blocked (paywalled). Card not added.'); return; } var dm = document.getElementById('up-dm').value; var agMap = { CreditMarkets: 'A1', Macro: 'A3', Regulatory: 'A4', Actuarial: 'A1' }; var tg = document.getElementById('up-tg').value.split(',').map(function(t) { t = t.trim(); return t.startsWith('#') ? t : '#' + t; }).filter(function(t) { return t.length > 1; }); C.push({ id: 'usr' + Date.now(), ti: document.getElementById('up-ti').value.trim(), sr: document.getElementById('up-sr').value.trim() || 'User Submission', ty: 'article', dt: new Date().toISOString().slice(0,10), dm: dm, sg: document.getElementById('up-sg').value, ag: agMap[dm] || 'A1', tg: tg.length ? tg : ['#privatecredit', '#usersubmission'], su: document.getElementById('up-su').value.trim(), url: document.getElementById('up-url').value.trim(), usr: true }); closeUpload(); render(); }
